spring.application.name=tp1-favoritos
server.port=${PORT:8080}

# API externa de productos (DummyJSON)
dummyjson.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}

# springdoc / swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# PostgreSQL: todo configurable por variables de entorno, con defaults de desarrollo
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tp1_favoritos}
spring.datasource.username=${POSTGRES_USER:tp1_user}
spring.datasource.password=${POSTGRES_PASSWORD:tp1_pass}

# JPA - el esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Seguridad / JWT. En producción SIEMPRE definir JWT_SECRET por variable de entorno.
security.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum!!}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
