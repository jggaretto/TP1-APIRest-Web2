spring.application.name=tp1-favoritos
server.port=8080

# API externa de productos (DummyJSON)
dummyjson.base-url=https://dummyjson.com

# springdoc / swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:tp1_favoritos}
spring.datasource.username=${POSTGRES_USER:tp1_user}
spring.datasource.password=${POSTGRES_PASSWORD:tp1_pass}

# JPA - el esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
